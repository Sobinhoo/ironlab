name: Validate IRONLab
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/ironlab-roadmap-foundations]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Temporary: package-lock.json predates the Tauri CLI dependency.
      # npm install resolves it on the runner; commit a regenerated lockfile
      # and switch back to npm ci before merging.
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run lint
      - run: node --experimental-strip-types --test tests/*.test.mjs

