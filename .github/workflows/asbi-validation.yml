name: ASBI Awake validation

on:
  push:
    branches:
      - feature/asbi-awake
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and Vite build
        run: npm run build
      - name: Lint
        run: npm run lint
